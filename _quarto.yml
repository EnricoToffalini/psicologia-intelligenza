# Impostazioni comuni al sito e al libro PDF.
# Il sito (profilo "sito", predefinito) contiene tutte le sezioni;
# il libro PDF (profilo "libro") contiene solo la parte didattica.
# Per rigenerare entrambi usare sempre render.bat / render.sh.
project:
  type: book
  output-dir: website

profile:
  default: sito

book:
  favicon: assets/favicon.ico
  output-file: "Psicologia-dell-Intelligenza"
  author:
    - name: '[Enrico Toffalini](https://enricotoffalini.github.io)'
      affiliation: "Dipartimento di Psicologia Generale, Università di Padova"

bibliography: references.bib
csl: assets/apa.csl
lang: it

execute:
  freeze: false
